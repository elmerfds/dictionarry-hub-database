name: Anime 1080p Max
description: "Anime 1080p Max targets high-quality anime releases with **English dub priority** but falls back to original Japanese audio. \n- **Prioritizes English dub** but accepts original audio when dubs aren't available.\n- **Audio Priority**: English Dub > Japanese > Other languages.\n- **Video Priority**: Bluray-1080p (final upgrade) > WEB-DL > WEBRip.\n- **Low minimum threshold** to capture older anime releases that may have limited format options.\n- **Maximum 1080p** - no 2160p content to keep file sizes manageable."
tags:
- Anime
- 1080p Max
- English Dub Priority
- Bluray Final
- Low Threshold
upgradesAllowed: true
minCustomFormatScore: 100  # Very low threshold for older anime
upgradeUntilScore: 400000
minScoreIncrement: 1
