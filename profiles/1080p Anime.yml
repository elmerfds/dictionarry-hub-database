name: Anime 1080p Max
description: "Anime 1080p Max targets high-quality anime releases with **English dub priority** and includes TRaSH Guide anime custom formats. \n- **Prioritizes English dub** via Dual Audio releases but accepts Japanese when dubs aren't available.\n- **Audio Priority**: Dual Audio (Eng+Jpn) > Dubs Only > Japanese > Surround Audio formats.\n- **Video Priority**: Anime BD Tiers > 1080p Bluray (final upgrade) > WEB-DL > WEBRip.\n- **Special Features**: 10-bit support, Uncensored preference, blocks Raw releases.\n- **Maximum 1080p** - blocks all 2160p content for manageable file sizes."
tags:
- Anime
- 1080p Max
- English Dub Priority
- Bluray Final
- Low Threshold
